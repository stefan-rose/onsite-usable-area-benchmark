# -----------------------------------------------------------------------------
# Local path configuration for onsite-usable-area-benchmark
#
# Copy this file to `config.toml` and edit the values below to point at your
# local copies of the input data. See docs/DATA_SOURCES.md for where to obtain
# each dataset. `config.toml` is gitignored so your local paths never enter
# version control.
#
# CURRENT STATUS (2026-09-03): the pipeline scripts still contain hard-coded
# BASE = Path(...) declarations at the top of each file. Editing those
# directly is currently required in addition to setting values here. A
# future refactor will route all path resolution through this file via a
# `scripts/_config.py` helper.
#
# TOML has no native variable interpolation. Values below marked
# "relative to paths.base" must be joined with paths.base by the consuming
# script; absolute paths are used verbatim.
# -----------------------------------------------------------------------------

[paths]
# Root of the local data directory. All "relative to paths.base" values
# below are joined against this root.
#
# Set your own root in a local, gitignored config.toml containing only:
#   [paths]
#   base = "/your/path/to/IEDO"
# or export IEDO_BASE. Either overrides this placeholder.
base = "~/path/to/IEDO"

# Working directory for per-parcel intermediates (parquet, gpkg). Defaults
# to the intermediate/ directory inside the analysis repo.
intermediate = "./intermediate"

# Output directory for aggregate CSVs and summary tables. Defaults to the
# outputs/ directory inside the analysis repo.
outputs = "./outputs"

# Directory for figure PDFs/PNGs written by build_fig1_conceptual.py and
# other figure-generation scripts.
figures = "./figures"

# -----------------------------------------------------------------------------
# Parcel universe
# -----------------------------------------------------------------------------

[inputs.parcels]
# Source parcel fabric (proprietary; derived from LightBox + Land Records).
# On the author's system this points at the M-FIND-derived working file.
# Public users should obtain M-FIND v1.1 from Zenodo:
#   https://doi.org/10.5281/zenodo.21827821
# and set this to their local M-FIND geometry file.
#
# Relative to paths.base:
source_gpkg = "Data/Site Lists/New Site List Effort/Parcel Match Outputs/geocoded_matches/joined_output/final_filtering/Working Site Lists/matched_collapsed_filtered.gpkg"

# Facility-level joined site list (MECS-scaled), used by 01_build_parcel_universe.py
# for the NAICS-based filtering step. Relative to paths.base:
facility_csv = "Data/Site Lists/Sites MECS Scaled/aggregated_facility_level_site_list_2026_04_23.csv"

# Working parcel universe (305,123 CONUS parcels, EPSG:5070), produced by
# scripts/01_build_parcel_universe.py and consumed by every downstream
# script. Relative to paths.base:
working_gpkg = "Scripts/applied_energy_paper/intermediate/parcels_conus_2026_04_23.gpkg"

# -----------------------------------------------------------------------------
# reV composite exclusion rasters (NLR)
# -----------------------------------------------------------------------------

[inputs.rev_solar]
# All paths relative to paths.base.
open      = "Data/reV Exclusions/composite_exclusions_open.tif"
reference = "Data/reV Exclusions/composite_exclusions_reference.tif"
limited   = "Data/reV Exclusions/composite_exclusions_limited.tif"
# revPJ variant (parcel-fabric joined; solar only, diagnostic):
parcel_joined = "Data/reV Exclusions/conus_percent_inclusion_all_parcels.tif"

[inputs.rev_wind]
# 115 m hub height, 170 m rotor diameter. All relative to paths.base.
# Headline (April 2026) layers: ~92.1 m grid, EPSG:5070, nodata 255.
open      = "Data/reV Exclusions/Wind/lbw_open_115hh_170rd.tif"
reference = "Data/reV Exclusions/Wind/lbw_reference_115hh_170rd.tif"
limited   = "Data/reV Exclusions/Wind/lbw_limited_115hh_170rd.tif"

# Additional wind turbine configurations (2026-10-06 NLR delivery and later).
# 90 m grid, NLR Albers (ESRI:102008-equivalent), nodata 255. Each table is
# keyed by a turbine id consumed by
#   scripts/05_rev_wind_composite_scenarios.py --turbine <id>
# The default turbine id "bespoke_115hh_170rd" maps to [inputs.rev_wind]
# above. Scenario entries whose file does not yet exist are skipped at run
# time with a warning.
# Open is turbine-agnostic (NLR, 2026-10-23: the Open scenario applies no
# turbine-specific setbacks), so every turbine points at the generic Open
# layer. The 90 m generic Open (wind_open_exclusions.tif) matches the published
# ~92.1 m lbw_open to 1.000004 in included area (scripts/validation/
# compare_wind_open_layers.py).
# TODO (on NLR delivery): replace the limited placeholder filenames below
# with the delivered names and record their md5 in the run log.
[inputs.rev_wind_turbines.ge_80hh_77rd]
hub_height_m     = 80
rotor_diameter_m = 77
reference = "Data/reV Exclusions/Wind/reV_composite_layers_10_6_26/GE_80hh_77rd/wind_exclusions_80hh_77rd.tif"
open      = "Data/reV Exclusions/Wind/wind_open_exclusions.tif"  # generic Open, 90 m (NLR 2026-10-23; md5 d510fe2309ba6e87ae7662f437d1d529)
limited   = "Data/reV Exclusions/Wind/wind_limited_exclusions_80hh_77rd.tif"  # NLR 2026-10-23; md5 ecb328de5d37a30c073d62ac2e89b5e6

# Smaller turbine classes (Reference only; turbine-class sensitivity table).
[inputs.rev_wind_turbines.bergey_24hh_10rd]
hub_height_m     = 24
rotor_diameter_m = 9.6
reference = "Data/reV Exclusions/Wind/reV_composite_layers_10_6_26/Bergey_24hh_10rd/wind_exclusions_24hh_10rd.tif"

[inputs.rev_wind_turbines.npower_37hh_21rd]
hub_height_m     = 37
rotor_diameter_m = 20.7
reference = "Data/reV Exclusions/Wind/reV_composite_layers_10_6_26/NorthernPower_37hh_21rd/wind_exclusions_37hh_21rd.tif"

[inputs.rev_wind_turbines.vestas_60hh_47rd]
hub_height_m     = 60
rotor_diameter_m = 47
reference = "Data/reV Exclusions/Wind/reV_composite_layers_10_6_26/Vestas_60hh_47rd/wind_exclusions_60hh_47rd.tif"

# 115/170 on the 10/6 90 m grid, used to validate the April headline layers
# against the grid the GE layers are delivered on.
[inputs.rev_wind_turbines.bespoke_115hh_170rd_grid90]
hub_height_m     = 115
rotor_diameter_m = 170
reference = "Data/reV Exclusions/Wind/reV_composite_layers_10_6_26/Bespoke_115hh_170rd/wind_exclusions_115hh_170rd.tif"
open      = "Data/reV Exclusions/Wind/wind_open_exclusions.tif"  # generic Open, 90 m (NLR 2026-10-23; md5 d510fe2309ba6e87ae7662f437d1d529)
limited   = "Data/reV Exclusions/Wind/wind_limited_exclusions_115hh_170rd.tif"  # 90 m (NLR 2026-10-26; md5 be74068193193fc6c9652aa4a3af638f)

# -----------------------------------------------------------------------------
# NLCD 2021 (via Google Earth Engine)
# -----------------------------------------------------------------------------

[inputs.nlcd]
# Directory containing 17 state-batch CSVs from a GEE reduceRegions
# extraction. Expected filename pattern:
#   2021_NLCD_parcels_area_m2_*.csv
# Relative to paths.base:
gee_extract_dir = "Data/LC_Output/output_4_15_26"

# -----------------------------------------------------------------------------
# Wind binary exclusion layers
# -----------------------------------------------------------------------------

[inputs.wind_binary]
# All shapefiles relative to paths.base.
airports_hifld    = "Data/wind_exclusions/Airports/Airports.shp"
dod_airspace      = "Data/wind_exclusions/FAA_SUA/Special_Use_Airspace.shp"
critical_habitat  = "Data/wind_exclusions/Critical_Hab_POLY/crithab_poly.shp"
urban_areas       = "Data/wind_exclusions/Urban_Areas/Urban_Areas.shp"

# NWI wetlands and slope flags are produced by scripts in
# scripts/data_download/ and cached as per-parcel flag CSVs.
# Relative to paths.base:
nwi_flags   = "Scripts/applied_energy_paper/intermediate/wind_flags/flag_nwi.csv"
slope_flags = "Scripts/applied_energy_paper/intermediate/wind_flags/flag_slope_gt25.csv"

# -----------------------------------------------------------------------------
# Projection
# -----------------------------------------------------------------------------

[projection]
# All spatial operations occur in this equal-area projection.
crs = "EPSG:5070"

# -----------------------------------------------------------------------------
# Wind turbine spec (recorded for provenance)
# -----------------------------------------------------------------------------

[wind_spec]
# The reV wind rasters listed under [inputs.rev_wind] correspond to this spec.
hub_height_m       = 115
rotor_diameter_m   = 170
