[workspace]
name = "onsite-usable-area-benchmark"
version = "0.1.0"
description = "Analysis pipeline for the onsite usable-area benchmarking paper (NLCD vs reV method comparison at U.S. manufacturing parcels)."
authors = ["Stefan Rose <stefan.rose@pnnl.gov>", "Dakota Ramos <dakota.ramos@nlr.gov>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]
license = "BSD-3-Clause"
readme = "README.md"

# ---------------------------------------------------------------------------
# Python stack (aggregation, reV zonal statistics, GEE extraction ingest,
# figure generation).
#
# Version bounds are minor-version floors resolved on 2026-09-03; the exact
# byte-reproducible pins live in `pixi.lock`. To reproduce the environment
# used to produce the paper's published numbers, use `pixi install --frozen`
# (installs exactly what is in pixi.lock).
# ---------------------------------------------------------------------------
[dependencies]
python           = ">=3.14,<3.15"
numpy            = ">=2.5"
pandas           = ">=3.0"
pyarrow          = ">=25.0"
geopandas        = ">=1.1"
shapely          = ">=2.1"
fiona            = ">=1.10"
pyproj           = ">=3.7"
rasterio         = ">=1.5"
rasterstats      = ">=0.21"
matplotlib-base  = ">=3.11"
tomli            = ">=2.4"      # config.toml parser (stdlib in 3.11+; explicit for older platforms)
earthengine-api  = ">=1.7"      # GEE Python client (used only when re-running the NLCD extraction)

# ---------------------------------------------------------------------------
# R stack (NLCD wind binary exclusions, airport-buffer sensitivity,
# parcel-area-floor sensitivity, NWI/slope flagging).
# ---------------------------------------------------------------------------
r-base           = ">=4.5,<4.6"
r-terra          = ">=1.9"
r-sf             = ">=1.1"
r-exactextractr  = ">=0.10"
r-dplyr          = ">=1.2"
r-tidyr          = ">=1.3"
r-readr          = ">=2.2"
r-purrr          = ">=1.2"
r-tibble         = ">=3.3"
r-rcpptoml       = ">=0.2"      # TOML parser for scripts/_config.R

[tasks]
# Convenience task aliases. Users can override paths in config.toml.
sanity-check     = "python scripts/00_sanity_check_parcel_universe.py"
build-universe   = "python scripts/01_build_parcel_universe.py"
rev-solar        = "python scripts/02_rev_solar_composite_scenarios.py"
rev-solar-pj     = "python scripts/03_rev_solar_parcel_joined.py"
nlcd-solar       = "python scripts/04_nlcd_full_population_solar.py"
rev-wind         = "python scripts/05_rev_wind_composite_scenarios.py"
forest-sens      = "python scripts/06_forest_sensitivity_solar.py"
nlcd-wind-pct    = "python scripts/07_nlcd_wind_percentage_only.py"
nlcd-wind-5layer = "Rscript scripts/08_nlcd_wind_binary_exclusions.R"
airport-sens     = "Rscript scripts/09_airport_buffer_sensitivity.R"
nlcd-wind-7layer = "Rscript scripts/10_rebuild_headline_3km_and_add_slope_nwi.R"
floor-sens       = "Rscript scripts/11_parcel_area_floor_sensitivity.R"
wind-turbines    = "python -u scripts/12_wind_turbine_config_summaries.py"
# Script 13 takes the published size-bin figure CSV (2026-07-31) as an argument:
#   pixi run fig-data <published_bins.csv>
fig-data         = "python -u scripts/13_build_manuscript_figure_data.py"
fig1-conceptual  = "python scripts/build_fig1_conceptual.py"
# Figures 2 and 3 (Vega-Lite) are rendered with vl-convert, which is not in
# this environment. See docs/FIGURE_TABLE_MAP.md for the uv command.
